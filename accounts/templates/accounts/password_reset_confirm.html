{% extends "base.html" %}
{% block content %}
<div class="auth-card">
{% if validlink %}
  <h1>Nouveau mot de passe</h1>
  <form method="post">{% csrf_token %}
    {% include "accounts/_form.html" with form=form %}
    <button class="primary" type="submit">Enregistrer</button>
  </form>
{% else %}
  <h1>Lien invalide</h1>
  <p>Ce lien a expiré ou a déjà été utilisé.</p>
  <a href="{% url 'accounts:password_reset' %}">Demander un nouveau lien</a>
{% endif %}
</div>
{% endblock %}
