{% extends "base.html" %}
{% block title %}Créer un compte{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Créer un compte</h1>
  <form method="post">{% csrf_token %}
    {% include "accounts/_form.html" with form=form %}
    <button class="primary" type="submit">Créer mon compte</button>
  </form>
  <div class="auth-links"><a href="{% url 'accounts:login' %}">J'ai déjà un compte</a></div>
</div>
{% endblock %}
