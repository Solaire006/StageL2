# /etc/nginx/sites-available/jobsapp  (then: ln -s ../sites-available/jobsapp /etc/nginx/sites-enabled/)
# Nginx is the front door: it handles HTTPS, serves CSS/JS files directly,
# and forwards everything else to Gunicorn (the Django app) on 127.0.0.1:8000.

# 1) Plain HTTP: send everyone to HTTPS.
server {
    listen 80;
    server_name jobs.lab.local;
    return 301 https://$host$request_uri;
}

# 2) HTTPS
server {
    # (`listen ... http2` works on every nginx version; newer ones only print a deprecation notice)
    listen 443 ssl http2;
    server_name jobs.lab.local;

    # Self-signed certificate for the simulated deployment (see DEPLOY.md, step 6).
    ssl_certificate     /etc/ssl/jobsapp/jobsapp.crt;
    ssl_certificate_key /etc/ssl/jobsapp/jobsapp.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The app only receives small forms.
    client_max_body_size 2m;

    # Hide the Nginx version number.
    server_tokens off;

    access_log /var/log/nginx/jobsapp.access.log;
    error_log  /var/log/nginx/jobsapp.error.log;

    # CSS/JS collected by `manage.py collectstatic`
    location /static/ {
        alias /srv/jobsapp/staticfiles/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        # Django needs these to know the real host, client IP and that the
        # visitor used HTTPS (see DJANGO_BEHIND_PROXY in settings.py).
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
